services:
  # back em nodejs
  back:
    build: ./back
    container_name: conectacausa_back
    #restart: always
    restart: unless-stopped

    environment:
      - API_PORT=3000
      - DB_TYPE=mysql
      - DB_HOST=dbmaria
      - DB_USER=root
      - DB_PASSWORD=teste@123
      - DB_PORT=3306
      - DB_DATABASE=conectacausa
      - DB_RESET=false
      - JWT_SECRET=e8592b7c745d17bd7c7132caaa27092df27522bc18ea551704bf23c589132a3a

    ports:
      - "4002:3000"  # Acesse o sistema via http://IP_DO_SERVIDOR:8080
    volumes:
      - ./uploads:/app/uploads  # Mapeia a raiz inteira (bancosangue/) permitindo edição em tempo real
      - /app/node_modules
    #depends_on:
    #  - dbmaria
    networks:
      - fatectqnet
  # Servidor Web + API/Front PHP
  web:
    build: ./web
    container_name: conectacausa_web
    #restart: always
    restart: unless-stopped
    
    ports:
      - "8087:80"  # Acesse o sistema via http://IP_DO_SERVIDOR:8080
    volumes:
      - ./web:/var/www/html  # Mapeia a raiz inteira (bancosangue/) permitindo edição em tempo real
    #depends_on:
    #  - dbmaria
    networks:
      - fatectqnet


networks:
  fatectqnet:
    external: true